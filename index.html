<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Life Tracker</title>
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#1b1f2a;--muted:#6b7280;--accent:#2563eb;--ok:#16a34a;--warn:#dc2626;--line:#e5e7eb;--soft:#eef2ff;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121418;--card:#1c2028;--text:#e8eaef;--muted:#9aa3b2;--accent:#6ea8ff;--ok:#4ade80;--warn:#f87171;--line:#2b303b;--soft:#232a38;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121418;--card:#1c2028;--text:#e8eaef;--muted:#9aa3b2;--accent:#6ea8ff;--ok:#4ade80;--warn:#f87171;--line:#2b303b;--soft:#232a38;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);font-size:16px;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
header{padding:14px 16px 6px;font-size:22px;font-weight:bold;max-width:560px;margin:0 auto}
nav{display:flex;gap:6px;padding:6px 12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;max-width:584px;margin:0 auto}
nav button{flex:1;padding:12px 2px;border:0;border-radius:12px;background:var(--card);color:var(--muted);font-size:13px;font-weight:bold;cursor:pointer}
nav button.on{background:var(--accent);color:#fff}
main{padding:8px 14px 48px;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
h2{font-size:17px;margin:0 0 10px}
.muted{color:var(--muted);font-size:13px}
.ctr{text-align:center}
.lbl{font-size:19px;font-weight:bold}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);font-size:16px;font-family:inherit}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dayNav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.dayNav .ctr{flex:1}
.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--soft);color:var(--text);font-size:15px;font-weight:bold;cursor:pointer}
.btn.pri{background:var(--accent);color:#fff}
.btn.sm{padding:9px 12px;font-size:13px}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.row input{flex:1}
.progress{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px}
.progress>div{height:100%;width:0;background:var(--ok);transition:width .3s}
.pills{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.pill{border:2px solid var(--line);background:var(--card);color:var(--text);border-radius:14px;padding:14px 10px;font-size:15px;font-weight:bold;text-align:left;cursor:pointer}
.pill.on{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.pill small{display:block;color:var(--muted);font-weight:normal;font-size:12px;margin-top:4px}
.step{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.stepper{display:flex;align-items:center;gap:12px}
.stepper .btn{width:50px;height:50px;padding:0;font-size:22px;border-radius:50%}
.val{font-size:26px;font-weight:bold;min-width:50px;text-align:center}
.bigNum{font-size:26px;font-weight:bold}
.ok{color:var(--ok)}
.bad{color:var(--warn)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--soft);border-radius:12px;padding:12px}
.stat b{display:block;font-size:17px;margin:3px 0}
.rem{display:grid;grid-template-columns:112px 1fr auto auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.rem input[type=time]{padding:8px}
.rem input[type=text]{padding:8px;font-size:14px}
.rem input[type=checkbox]{width:22px;height:22px}
.news{border-bottom:1px solid var(--line);padding:10px 0}
.news a{color:var(--accent);font-size:13px}
.rem2{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.hint{font-size:13px;color:var(--muted);margin:0 0 10px}
.subtabs{display:flex;gap:6px;margin-bottom:12px}
.subtabs button{flex:1;padding:11px 4px;border:0;border-radius:12px;background:var(--card);color:var(--muted);font-weight:bold;font-size:14px;cursor:pointer}
.subtabs button.on{background:var(--accent);color:#fff}
.hold{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.hTop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.banner{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));background:var(--accent);color:#fff;border-radius:16px;padding:14px;z-index:20;display:none;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:536px;margin:0 auto}
.banner.show{display:block}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
@media (max-width:360px){.pills,.grid2,.stats{grid-template-columns:1fr}.rem{grid-template-columns:100px 1fr}}
</style>
</head>
<body>
<header>Life Tracker</header>
<nav>
<button class="on" data-tab="aaj">Today</button>
<button data-tab="exp">Spending</button>
<button data-tab="inv">Invest</button>
<button data-tab="plan">Plan</button><button data-tab="week">Week</button>
<button data-tab="rem">Reminder</button>
</nav>
<main>
<section id="aaj">
<div class="dayNav"><button class="btn" id="prev">‹</button><div class="ctr"><div class="lbl" id="dayLbl"></div><div class="muted" id="dayType"></div></div><button class="btn" id="next">›</button></div>
<div class="ctr" style="margin-bottom:12px"><button class="btn sm ghost" id="goToday">Go to today</button> <input type="date" id="jump" style="width:auto;display:inline-block;padding:8px"></div>
<div class="card"><div class="muted" id="progTxt"></div><div class="progress"><div id="prog"></div></div></div>
<div class="card" id="todayBox"></div>
</section>
<section id="exp" hidden></section>
<section id="inv" hidden></section>
<section id="plan" hidden></section><section id="week" hidden></section>
<section id="rem" hidden></section>
</main>
<div class="banner" id="banner"></div>
<div class="toast" id="toast"></div>
<script>
const KEY="life-tracker-v1";
const WD=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],MO=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const $=id=>document.getElementById(id), pad=n=>String(n).padStart(2,"0"), num=v=>Number(v)||0;
const fmtKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>fmtKey(new Date());
const lab=d=>`${WD[d.getDay()]} ${d.getDate()} ${MO[d.getMonth()]}`;
const isOff=d=>d.getDay()===4||d.getDay()===5;
const esc=s=>String(s).replace(/[&"<]/g,c=>({"&":"&amp;","\"":"&quot;","<":"&lt;"}[c]));
const fmt=n=>Number(n).toLocaleString("en-IN",{maximumFractionDigits:2});
const sgn=n=>n>=0?"+":"";
const cls=n=>n>=0?"ok":"bad";
const pcOf=(a,b)=>b?a/b*100:0;
const NDAYS=Math.round((new Date(2030,11,31)-new Date(2026,9,17))/864e5)+1;
const DAYS=Array.from({length:NDAYS},(_,i)=>new Date(2026,9,17+i));
const MS=Array.from({length:60},(_,i)=>{const d=new Date(2026,9+i,1);return{key:`${d.getFullYear()}-${pad(d.getMonth()+1)}`,label:`${MO[d.getMonth()]} ${d.getFullYear()}`};});
const DEF_REM=[
{id:1,time:"01:00",label:"Eat your tiffin on break, use phone less",on:true},
{id:2,time:"01:30",label:"Last chai or coffee. After this, only water",on:true},
{id:3,time:"03:30",label:"Eat fruit, chana or nuts",on:true},
{id:4,time:"08:15",label:"Keep phone away, make the room dark",on:true},
{id:5,time:"15:30",label:"Wake up: drink water, 5 min stretching (also set on phone)",on:false},
{id:6,time:"18:30",label:"Pack tiffin (also set on phone)",on:false},
{id:7,time:"19:00",label:"Leave home (also set on phone)",on:false}
];
const NEWS=[
{d:"13 Oct 2026",t:"Nifty 50 closed at 22,721.95 (+1.60%) and Sensex at 73,033.78 (+1.54%). IT stocks rallied after HCLTech's Q2 results.",s:"Ventura Securities",u:"https://www.venturasecurities.com/?p=65192"},
{d:"12 Oct 2026",t:"Markets fell. Sensex closed at 71,924.68 (-0.76%) and Nifty at 22,363.35 (-0.70%).",s:"Kotak Neo",u:"https://www.kotakneo.com/news/market-news/stock-market-update-13-october-2026-sensex-nifty/"},
{d:"8 Oct 2026",t:"In early trade Sensex fell about 368 points and Nifty slipped below 22,500. The rupee opened near 96.7 per dollar.",s:"Kotak Neo",u:"https://www.kotakneo.com/news/market-news/stock-market-update-8-october-2026-sensex-nifty/"},
{d:"Risks to watch",t:"Inflation, crude oil prices, rupee movement and how narrow the rally is across sectors remain the main risks.",s:"Ventura Securities",u:"https://www.venturasecurities.com/?p=65192"}
];

let state;
try{state=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){state=null}
if(!state)state={days:{},exp:{"2026-10":{salary:30000,doodh:4000,travel:6000,ghar:0,other:0}},target:30000};
state.days=state.days||{};state.exp=state.exp||{};state.target=state.target||30000;state.rem=state.rem||DEF_REM;state.fired=state.fired||{};
normalize();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
const hrs=(s,w)=>{if(!s||!w)return null;const[a,b]=s.split(":").map(Number),[c,g]=w.split(":").map(Number);let m=c*60+g-a*60-b;if(m<0)m+=1440;return m/60};

function todayIdx(){const t=new Date();t.setHours(0,0,0,0);return Math.min(NDAYS-1,Math.max(0,Math.round((t-DAYS[0])/864e5)));}
let di=todayIdx(), mi=0, ct="stock", wkIdx=Math.floor(todayIdx()/7);
const dayKey=()=>fmtKey(DAYS[di]);
const dd=()=>state.days[dayKey()]||{};
const setDay=(k,v)=>{const key=dayKey();(state.days[key]=state.days[key]||{})[k]=v;save();};
const done=v=>[v.walk,v.skill,v.meals,v.phone,num(v.paani)>=8].filter(Boolean).length;
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove("show"),1200);}

/* Aaj */
const pill=(v,k,t,s)=>`<button class="pill ${v[k]?"on":""}" data-tog="${k}">${v[k]?"✓ ":""}${t}<small>${s}</small></button>`;
const step=(v,k,t,s)=>`<div class="step"><div><b>${t}</b><div class="muted">${s}</div></div><div class="stepper"><button class="btn" data-step="${k}" data-d="-1">−</button><span class="val">${num(v[k])}</span><button class="btn" data-step="${k}" data-d="1">+</button></div></div>`;
function renderToday(){
const d=DAYS[di],v=dd(),h=hrs(v.sleep,v.wake),n=done(v);
$("dayLbl").textContent=lab(d);
$("dayType").textContent=isOff(d)?"Off day":"Shift day";
$("prog").style.width=(n/5*100)+"%";
$("progTxt").textContent=`${n} of 5 daily tasks done`;
$("todayBox").innerHTML=`
<div class="grid2"><label>Slept at<input type="time" id="sl" value="${v.sleep||""}"></label><label>Woke at<input type="time" id="wk" value="${v.wake||""}"></label></div>
<div class="row"><button class="btn sm" data-now="sleep">Sleeping now</button><button class="btn sm" data-now="wake">Woke up now</button></div>
<div class="muted">Sleep: <b>${h==null?"-":h.toFixed(1)} hours</b></div>
${step(v,"paani","Water (glasses)","Target 8")}
${step(v,"junk","Junk food","5 or fewer per week")}
<div class="pills">${pill(v,"walk","Walk","20 min")}${pill(v,"skill","Skill-building","20 min")}${pill(v,"meals","Meals on time","Before and after shift")}${pill(v,"phone","Phone limit","Except breaks")}</div>
<label>Notes<input type="text" id="nt" value="${esc(v.notes||"")}"></label>`;
}
$("todayBox").addEventListener("click",e=>{
const b=e.target.closest("button");if(!b)return;
if(b.dataset.tog){const k=b.dataset.tog;setDay(k,!dd()[k]);}
else if(b.dataset.step){const k=b.dataset.step;setDay(k,Math.max(0,num(dd()[k])+Number(b.dataset.d)));}
else if(b.dataset.now){const n=new Date();setDay(b.dataset.now,pad(n.getHours())+":"+pad(n.getMinutes()));}
else return;
renderToday();toast("Saved");
});
$("todayBox").addEventListener("change",e=>{
if(e.target.id==="sl"){setDay("sleep",e.target.value);renderToday();toast("Saved");}
if(e.target.id==="wk"){setDay("wake",e.target.value);renderToday();toast("Saved");}
});
$("todayBox").addEventListener("input",e=>{if(e.target.id==="nt")setDay("notes",e.target.value);});
$("prev").onclick=()=>{di=Math.max(0,di-1);renderToday();};
$("next").onclick=()=>{di=Math.min(NDAYS-1,di+1);renderToday();};
$("goToday").onclick=()=>{di=todayIdx();renderToday();};
$("jump").addEventListener("change",e=>{const v=e.target.value;if(!v)return;const[y,m,d]=v.split("-").map(Number);di=Math.min(NDAYS-1,Math.max(0,Math.round((new Date(y,m-1,d)-DAYS[0])/864e5)));renderToday();});

/* Kharch */
const fld=(f,t,v)=>`<label>${t}<input type="number" inputmode="numeric" min="0" data-f="${f}" value="${v??""}"></label>`;
function renderExp(){
const m=MS[mi],e=state.exp[m.key]||{};
const spend=num(e.doodh)+num(e.travel)+num(e.ghar)+num(e.other);
const bachat=e.salary!=null?e.salary-spend:null;
let run=0;
for(let i=0;i<=mi;i++){const y=state.exp[MS[i].key]||{};if(y.salary!=null)run+=y.salary-(num(y.doodh)+num(y.travel)+num(y.ghar)+num(y.other));}
const pc=Math.min(100,Math.max(0,run/state.target*100));
$("exp").innerHTML=`
<div class="dayNav"><button class="btn" id="mPrev">‹</button><div class="ctr"><div class="lbl">${m.label}</div><div class="muted">Enter salary and expenses, savings are calculated automatically</div></div><button class="btn" id="mNext">›</button></div>
<div class="card">
<div class="grid2">${fld("salary","Salary",e.salary)}${fld("doodh","Milk",e.doodh)}${fld("travel","Travel + food",e.travel)}${fld("ghar","Sent home",e.ghar)}${fld("other","Other",e.other)}</div>
<div class="grid2" style="margin-top:6px"><div><div class="muted">Total kharch</div><div class="bigNum">${fmt(spend)}</div></div><div><div class="muted">Savings</div><div class="bigNum ${bachat!=null&&bachat<0?"bad":"ok"}">${bachat==null?"-":fmt(bachat)}</div></div></div>
</div>
<div class="card">
<h2>Emergency fund</h2>
<div class="progress"><div style="width:${pc}%"></div></div>
<div class="muted" style="margin:8px 0 12px">${fmt(run)} / ${fmt(state.target)} (${Math.round(pc)}%)</div>
<label>Target<input type="number" inputmode="numeric" id="tgt" value="${state.target}"></label>
</div>`;
}
$("exp").addEventListener("change",e=>{
const t=e.target;
if(t.dataset.f){const k=MS[mi].key;state.exp[k]=state.exp[k]||{};state.exp[k][t.dataset.f]=t.value===""?null:Number(t.value);}
else if(t.id==="tgt"){state.target=Math.max(1,num(t.value));}
else return;
save();renderExp();toast("Saved");
});
$("exp").addEventListener("click",e=>{
if(e.target.id==="mPrev"){mi=Math.max(0,mi-1);renderExp();}
if(e.target.id==="mNext"){mi=Math.min(MS.length-1,mi+1);renderExp();}
});

/* Invest */
const CATS={stock:"Stocks",mf:"Mutual Funds",etf:"ETF"};
const PH={stock:"Stock ka naam ya symbol (jaise TCS)",mf:"Mutual fund ka poora naam",etf:"ETF ka naam"};
function vals(h){
const cur=h.close!=null?h.close:h.buy, hasPrev=h.prev!=null;
const inv=h.units*h.buy, val=h.units*cur;
return{cur,inv,val,pl:val-inv,hasPrev,day:hasPrev?h.units*(cur-h.prev):0,base:h.units*(hasPrev?h.prev:cur)};
}
function agg(list){return list.map(vals).reduce((a,v)=>({inv:a.inv+v.inv,val:a.val+v.val,day:a.day+v.day,base:a.base+v.base}),{inv:0,val:0,day:0,base:0});}
const stat=(a,b,c)=>`<div class="stat"><div class="muted">${a}</div><b class="${c||""}">${b}</b></div>`;
function holdHTML(h){
const v=vals(h);
return `<div class="hold">
<div class="hTop"><b>${esc(h.name)}</b><span style="display:flex;gap:6px"><a class="btn sm ghost" style="text-decoration:none;color:var(--accent)" href="https://www.google.com/search?q=${encodeURIComponent(h.name+" live price")}" target="_blank" rel="noopener">Live price</a><button class="btn sm ghost" data-del="${ct}:${h.id}">Remove</button></span></div>
<div class="muted">${h.units} units · buy ${fmt(h.buy)} · invested ${fmt(v.inv)}</div>
<div class="grid2" style="margin-top:10px">
<label>Day-end price<input type="number" step="any" inputmode="decimal" data-close="${ct}:${h.id}" value="${h.close??""}"></label>
<div><div class="muted">Current value</div><b style="font-size:20px">${fmt(v.val)}</b><div class="${cls(v.pl)}">P&amp;L ${sgn(v.pl)}${fmt(v.pl)} (${pcOf(v.pl,v.inv).toFixed(1)}%)</div></div>
</div>
<div class="grid2" style="margin-top:8px"><label>Brokerage + tax (total)<input type="number" step="any" data-cost="${ct}:${h.id}" value="${h.costs??""}"></label><label>Net P&amp;L<b class="${cls(v.pl-num(h.costs))}">${sgn(v.pl-num(h.costs))}${fmt(v.pl-num(h.costs))}</b></label></div>
<div class="row" style="margin-top:6px"><input type="number" step="any" id="bU${h.id}" placeholder="Units"><input type="number" step="any" id="bP${h.id}" placeholder="Price"><button class="btn sm" data-buy="${ct}:${h.id}">Add buy</button></div>
<div class="row" style="margin-top:6px"><input type="number" step="any" id="sU${h.id}" placeholder="Units sold"><input type="number" step="any" id="sP${h.id}" placeholder="Sell price"><button class="btn sm ghost" data-sell="${ct}:${h.id}">Sell</button></div>
<div class="muted" style="margin-top:6px">${v.hasPrev?`Since last close: <span class="${cls(v.day)}">${sgn(v.day)}${fmt(v.day)} (${pcOf(v.day,v.base).toFixed(2)}%)</span>`:"No previous close yet"}${h.cdate?` · ${h.cdate}`:""}</div>
</div>`;
}
function renderInv(){
const list=state.hold[ct], s=agg(list), all=agg([...state.hold.stock,...state.hold.mf,...state.hold.etf]);
const pl=s.val-s.inv;
$("inv").innerHTML=`
<div class="card"><h2>Market news</h2>
<div class="muted" style="margin-bottom:6px">This is a snapshot (confirmed news up to 16 Oct 2026), not a live feed. For daily updates, ask me to "update the market news".</div>
${NEWS.map(n=>`<div class="news"><div class="muted">${n.d}</div><div style="margin:4px 0">${n.t}</div><a href="${n.u}" target="_blank" rel="noopener">${n.s}</a></div>`).join("")}
</div>
<div class="subtabs">${Object.keys(CATS).map(k=>`<button class="${k===ct?"on":""}" data-ct="${k}">${CATS[k]}</button>`).join("")}</div>
<div class="card">
<div class="stats">
${stat(CATS[ct]+" invested",fmt(s.inv))}
${stat("Current value",fmt(s.val))}
${stat("Total P&amp;L",sgn(pl)+fmt(pl)+" ("+pcOf(pl,s.inv).toFixed(1)+"%)",cls(pl))}
${stat("Today's change",sgn(s.day)+fmt(s.day)+" ("+pcOf(s.day,s.base).toFixed(2)+"%)",cls(s.day))}
</div>
<div class="muted" style="margin-top:10px">Overall: invested ${fmt(all.inv)}, current ${fmt(all.val)}</div><div class="muted" style="margin-top:6px">Allocation: ${["stock","mf","etf"].map(k=>CATS[k]+" "+(all.val?Math.round(agg(state.hold[k]).val/all.val*100):0)+"%").join(" · ")}</div><div class="muted" style="margin-top:6px">Realized P&amp;L (sold): ${fmt((state.realized||{}).stock||0)} stocks · ${fmt((state.realized||{}).mf||0)} MF · ${fmt((state.realized||{}).etf||0)} ETF</div>
</div>
<div class="card"><h2>Add new ${CATS[ct]}</h2>
<label>Name<input type="text" id="hN" placeholder="${PH[ct]}"></label>
<div class="grid2"><label>Units / shares<input type="number" step="any" inputmode="decimal" id="hU"></label><label>Buy price (per unit)<input type="number" step="any" inputmode="decimal" id="hB"></label></div>
<label>Today's close price (optional)<input type="number" step="any" inputmode="decimal" id="hC"></label>
<button class="btn pri" id="hAdd">Add</button>
</div>
${list.map(holdHTML).join("")||`<div class="muted" style="margin-bottom:12px">No ${CATS[ct]} yet.</div>`}
<div class="card"><h2>My notes</h2>
<div class="row"><input type="text" id="nNote" placeholder="Write a note or news item"><button class="btn pri" id="nAdd">Add</button></div>
${state.notes.slice().reverse().map(n=>`<div class="rem2"><div><div>${esc(n.text)}</div><div class="muted">${n.date}</div></div><button class="btn sm ghost" data-nid="${n.id}">Remove</button></div>`).join("")||'<div class="muted">No notes yet.</div>'}
</div>
<div class="hint">Enter the day-end price every evening from your broker app. Mutual fund NAV updates overnight. This is only your record, not investment advice.</div>`;
}
$("inv").addEventListener("click",e=>{
const t=e.target.closest("button");if(!t)return;
if(t.dataset.ct){ct=t.dataset.ct;renderInv();return;}
if(t.id==="hAdd"){
const name=$("hN").value.trim(),units=Number($("hU").value),buy=Number($("hB").value),c=$("hC").value;
if(!name||!units||!buy){toast("Enter name, units and buy price");return;}
state.hold[ct].push({id:Date.now(),name,units,buy,close:c===""?null:Number(c),prev:null,cdate:c===""?null:today()});
save();renderInv();toast("Saved");return;
}
if(t.dataset.buy){const[c,id]=t.dataset.buy.split(":");const h=state.hold[c].find(x=>String(x.id)===id);const u=Number($("bU"+id).value),p=Number($("bP"+id).value);if(!h||!u||!p){toast("Enter units and price");return;}const tot=h.units*h.buy+u*p;h.units+=u;h.buy=tot/h.units;save();renderInv();toast("Average updated");return;}
if(t.dataset.sell){const[c,id]=t.dataset.sell.split(":");const h=state.hold[c].find(x=>String(x.id)===id);const u=Number($("sU"+id).value),p=Number($("sP"+id).value);if(!h||!u||!p||u>h.units){toast("Units (max "+(h?h.units:0)+") - enter valid units and price");return;}state.realized=state.realized||{stock:0,mf:0,etf:0};state.realized[c]=(state.realized[c]||0)+(p-h.buy)*u;h.units-=u;if(h.units<=0)state.hold[c]=state.hold[c].filter(x=>x!==h);save();renderInv();toast("Sale recorded");return;}
if(t.dataset.del){const[c,id]=t.dataset.del.split(":");state.hold[c]=state.hold[c].filter(x=>String(x.id)!==id);save();renderInv();return;}
if(t.id==="nAdd"){const text=$("nNote").value.trim();if(!text)return;state.notes.push({id:Date.now(),text,date:today()});save();renderInv();toast("Saved");return;}
if(t.dataset.nid){state.notes=state.notes.filter(x=>String(x.id)!==t.dataset.nid);save();renderInv();}
});
$("inv").addEventListener("change",e=>{
const t=e.target;if(t.dataset.cost){const[c,id]=t.dataset.cost.split(":");const h=state.hold[c].find(x=>String(x.id)===id);if(h){h.costs=num(t.value);save();renderInv();}return;}
if(!t.dataset.close)return;
const[c,id]=t.dataset.close.split(":");const h=state.hold[c].find(x=>String(x.id)===id);if(!h)return;
if(t.value===""){h.close=null;h.prev=null;h.cdate=null;}
else{if(h.cdate!==today()){h.prev=h.close!=null?h.close:null;}h.close=Number(t.value);h.cdate=today();}
save();renderInv();toast("Saved");
});

/* Week */
function renderWeek(){
let html="";
for(let w=wkIdx;w<=wkIdx&&w*7<NDAYS;w++){
const ds=DAYS.slice(w*7,w*7+7).map(d=>state.days[fmtKey(d)]||{});
const has=ds.some(v=>Object.keys(v).length>0);
const hs=ds.map(v=>hrs(v.sleep,v.wake)).filter(x=>x!=null);
const avg=hs.length?hs.reduce((a,b)=>a+b,0)/hs.length:null;
const junk=ds.reduce((a,v)=>a+num(v.junk),0);
const cnt=k=>ds.filter(v=>v[k]).length;
const st=(l,txt,good,t)=>`<div class="stat"><div class="muted">${l}</div><b class="${!has?"":good?"ok":"bad"}">${txt}</b><div class="muted">Target: ${t}</div></div>`;
html+=`<div class="card"><h2>Week of ${lab(DAYS[w*7])}</h2><div class="stats">
${st("Sleep (avg)",avg==null?"-":avg.toFixed(1)+" h",avg!=null&&avg>=6,"6+ h")}
${st("Junk food",junk,junk<=5,"5 or less")}
${st("Walk",cnt("walk")+" din",cnt("walk")>=3,"3+ days")}
${st("Skill-building",cnt("skill")+" din",cnt("skill")>=5,"5+ days")}
${st("Meals on time",cnt("meals")+" din",cnt("meals")>=5,"5+ days")}
${st("Phone limit",cnt("phone")+" din",cnt("phone")>=5,"5+ days")}
</div></div>`;
}
$("week").innerHTML=`<div class="dayNav"><button class="btn" id="wPrev">‹</button><div class="ctr"><div class="lbl">Week ${wkIdx+1}</div><div class="muted">from ${lab(DAYS[wkIdx*7])}</div></div><button class="btn" id="wNext">›</button></div>`+html;
}

$("week").addEventListener("click",e=>{if(e.target.id==="wPrev"){wkIdx=Math.max(0,wkIdx-1);renderWeek();}if(e.target.id==="wNext"){wkIdx=Math.min(Math.floor((NDAYS-1)/7),wkIdx+1);renderWeek();}});

/* Plan */
function normalize(){
state.days=state.days||{};state.exp=state.exp||{};state.target=state.target||30000;state.rem=state.rem||DEF_REM;state.fired=state.fired||{};
state.notes=state.notes||[];state.hold=state.hold||{stock:[],mf:[],etf:[]};
state.goals=state.goals||[];state.ins=state.ins||[];state.health=state.health||[];state.checkup=state.checkup||"";
state.career=state.career||{salary:30000,target:35000,date:"2027-10-16",log:[]};
}
const monthsTo=d=>Math.max(1,Math.ceil((new Date(d+"T00:00")-new Date())/(30.4*864e5)));
const daysTo=d=>Math.ceil((new Date(d+"T00:00")-new Date())/864e5);
const renderAll=()=>{renderToday();renderExp();renderInv();renderWeek();renderPlan();};
function bars(vals,color){
const mx=Math.max(1,...vals.map(Math.abs));const w=100/vals.length;
return `<svg viewBox="0 0 100 60" preserveAspectRatio="none" style="width:100%;height:110px">${vals.map((v,i)=>{const h=Math.abs(v)/mx*52;return `<rect x="${i*w+w*.15}" y="${58-h}" width="${w*.7}" height="${h}" fill="${color}"/>`}).join("")}</svg>`;
}
function trendHTML(){
const wk=[];
for(let w=Math.max(0,wkIdx-7);w<=wkIdx;w++){
const hs=DAYS.slice(w*7,w*7+7).map(d=>state.days[fmtKey(d)]||{}).map(v=>hrs(v.sleep,v.wake)).filter(x=>x!=null);
wk.push(hs.length?hs.reduce((a,b)=>a+b,0)/hs.length:0);
}
const mo=[];
for(let i=Math.max(0,mi-5);i<=mi;i++){const y=state.exp[MS[i].key]||{};mo.push(y.salary!=null?y.salary-(num(y.doodh)+num(y.travel)+num(y.ghar)+num(y.other)):0);}
return `<div class="card"><h2>Trends</h2><div class="muted">Sleep (avg hours), last 8 weeks</div>${bars(wk,"#2563eb")}<div class="muted" style="margin-top:12px">Monthly savings, last 6 months</div>${bars(mo,"#16a34a")}</div>`;
}
function trend2HTML(){
const jk=[],wd=[];
for(let w=Math.max(0,wkIdx-7);w<=wkIdx;w++){const ds=DAYS.slice(w*7,w*7+7).map(d=>state.days[fmtKey(d)]||{});jk.push(ds.reduce((a,v)=>a+num(v.junk),0));wd.push(ds.filter(v=>v.walk).length);}
const wts=state.health.filter(x=>num(x.weight)>0).slice(-8).map(x=>num(x.weight));
const mn=wts.length?Math.min(...wts):0;
return `<div class="card"><h2>Junk, walk and weight</h2><div class="muted">Junk food (count), last 8 weeks</div>${bars(jk,"#dc2626")}<div class="muted" style="margin-top:12px">Walk days, last 8 weeks</div>${bars(wd,"#0ea5e9")}<div class="muted" style="margin-top:12px">Weight change (kg, from the lowest), last ${wts.length} entries</div>${wts.length?bars(wts.map(x=>x-mn),"#9333ea"):'<div class="muted">Add weight in health records</div>'}</div>`;
}
function renderPlan(){
const c=state.career;
const goals=state.goals.map(g=>{
const pc=Math.min(100,g.target?g.saved/g.target*100:0);
const need=Math.max(0,(g.target-g.saved)/monthsTo(g.date));
return `<div class="hold"><div class="hTop"><b>${esc(g.name)}</b><button class="btn sm ghost" data-gdel="${g.id}">Remove</button></div><div class="muted">Target ${fmt(g.target)} · ${g.date}</div><div class="progress"><div style="width:${pc}%"></div></div><div class="grid2" style="margin-top:8px"><label>Saved so far<input type="number" data-gsave="${g.id}" value="${g.saved}"></label><div><div class="muted">Needed per month</div><b>${fmt(Math.round(need))}</b></div></div></div>`;
}).join("")||'<div class="muted" style="margin-bottom:12px">No goals yet.</div>';
const career=c.log.slice().reverse().map(x=>`<div class="rem2"><div><b>${esc(x.text)}</b><div class="muted">${x.date} · ${x.done?"Completed":"Pending"}</div></div><div class="row" style="margin:0"><button class="btn sm ghost" data-cdone="${x.id}">${x.done?"Undo":"Done"}</button><button class="btn sm ghost" data-cdel="${x.id}">Remove</button></div></div>`).join("")||'<div class="muted">No entries yet.</div>';
const ins=state.ins.map(x=>{const d=daysTo(x.renew);return `<div class="rem2"><div><b>${esc(x.type)}</b> <span class="muted">${esc(x.provider)}</span><div class="muted">Cover ${fmt(x.cover)} · Premium ${fmt(x.premium)}/year</div><div class="${d<30?"bad":"muted"}">Renewal ${x.renew} · ${d<0?"expired":d+" days left"}</div></div><button class="btn sm ghost" data-idel="${x.id}">Remove</button></div>`}).join("")||'<div class="muted">No policies yet.</div>';
const hl=state.health.slice().reverse().map(x=>`<div class="rem2"><div><b>${x.date}</b> <span class="muted">Weight ${esc(x.weight||"-")} · BP ${esc(x.bp||"-")} · Sugar ${esc(x.sugar||"-")}</span>${x.note?`<div class="muted">${esc(x.note)}</div>`:""}</div><button class="btn sm ghost" data-hdel="${x.id}">Remove</button></div>`).join("")||'<div class="muted">No records yet.</div>';
$("plan").innerHTML=`
${trendHTML()}${trend2HTML()}
<div class="card"><h2>Salary goal</h2>
<div class="grid2"><label>Current salary<input type="number" id="cSal" value="${c.salary}"></label><label>Target salary<input type="number" id="cTgt" value="${c.target}"></label></div>
<label>Target date<input type="date" id="cDate" value="${c.date}"></label>
<div class="muted">Gap: ${fmt(Math.max(0,c.target-c.salary))} per month · ${daysTo(c.date)} days left</div><div class="muted" style="margin-top:8px">Salary history: ${(c.hist||[]).map(x=>x.date+" → "+fmt(x.salary)).join(" · ")||"none yet"}</div></div>
<div class="card"><h2>Career log</h2>
<div class="row"><input type="text" id="cTxt" placeholder="Certification, appraisal, interview..."><button class="btn pri" id="cAdd">Add</button></div>${career}</div>
<div class="card"><h2>Goals</h2>${goals}
<div class="grid2"><label>Goal name<input type="text" id="gN" placeholder="House, car, retirement"></label><label>Target amount<input type="number" id="gT"></label></div>
<div class="grid2"><label>Target date<input type="date" id="gD"></label><label>Saved so far<input type="number" id="gS"></label></div>
<button class="btn pri" id="gAdd">Add goal</button></div>
<div class="card"><h2>Insurance</h2>${ins}
<div class="grid2"><label>Type<select id="iTy"><option>Health</option><option>Term</option><option>Vehicle</option><option>Other</option></select></label><label>Provider<input type="text" id="iPr"></label></div>
<div class="grid2"><label>Cover<input type="number" id="iCv"></label><label>Premium (per year)<input type="number" id="iPm"></label></div>
<label>Renewal date<input type="date" id="iRn"></label><button class="btn pri" id="iAdd2">Add policy</button></div>
<div class="card"><h2>Health record</h2>
<label>Next checkup date<input type="date" id="hCk" value="${state.checkup}"></label>
<div class="grid2"><label>Date<input type="date" id="hD" value="${today()}"></label><label>Weight (kg)<input type="text" id="hW"></label></div>
<div class="grid2"><label>BP<input type="text" id="hBP" placeholder="120/80"></label><label>Sugar<input type="text" id="hS"></label></div>
<label>Note<input type="text" id="hN2"></label><button class="btn pri" id="hAdd2b">Save record</button>
<div style="margin-top:12px">${hl}</div></div>
<div class="card"><h2>Backup</h2><div class="muted" style="margin-bottom:8px">Export to copy your data as text. In a new browser, paste it into Import to restore it.</div>
<div style="margin-bottom:8px">${(()=>{const d=state.lastBackup?Math.floor((new Date()-new Date(state.lastBackup+"T00:00"))/864e5):null;return d==null?'<span class="bad">No backup taken yet</span>':d>7?`<span class="bad">Last backup ${d} days ago, back up now</span>`:`Last backup: ${state.lastBackup}`})()}</div><div class="row"><button class="btn" id="bExp">Export</button><button class="btn" id="bImp">Import</button></div>
<textarea id="bTxt" rows="4" style="width:100%;border-radius:12px;padding:10px;background:var(--bg);color:var(--text);border:1px solid var(--line)"></textarea></div>`;
}
$("plan").addEventListener("click",e=>{
const t=e.target.closest("button");if(!t)return;
const del=(arr,id)=>arr.filter(x=>String(x.id)!==id);
if(t.dataset.gdel){state.goals=del(state.goals,t.dataset.gdel);}
else if(t.dataset.idel){state.ins=del(state.ins,t.dataset.idel);}
else if(t.dataset.hdel){state.health=del(state.health,t.dataset.hdel);}
else if(t.dataset.cdel){state.career.log=del(state.career.log,t.dataset.cdel);}
else if(t.dataset.cdone){const x=state.career.log.find(y=>String(y.id)===t.dataset.cdone);if(x)x.done=!x.done;}
else if(t.id==="cAdd"){const tx=$("cTxt").value.trim();if(!tx)return;state.career.log.push({id:Date.now(),text:tx,date:today(),done:false});}
else if(t.id==="gAdd"){const n=$("gN").value.trim(),tg=Number($("gT").value),dt=$("gD").value;if(!n||!tg||!dt){toast("Enter name, target and date");return;}state.goals.push({id:Date.now(),name:n,target:tg,saved:num($("gS").value),date:dt});}
else if(t.id==="iAdd2"){const rn=$("iRn").value;if(!rn){toast("Enter renewal date");return;}state.ins.push({id:Date.now(),type:$("iTy").value,provider:$("iPr").value.trim(),cover:num($("iCv").value),premium:num($("iPm").value),renew:rn});}
else if(t.id==="hAdd2b"){state.health.push({id:Date.now(),date:$("hD").value||today(),weight:$("hW").value,bp:$("hBP").value,sugar:$("hS").value,note:$("hN2").value});}
else if(t.id==="bExp"){state.lastBackup=today();$("bTxt").value=JSON.stringify(state);toast("Text ready, copy it");return;}
else if(t.id==="bImp"){
try{const s=JSON.parse($("bTxt").value);if(!s||!s.days)throw new Error("bad");state=s;normalize();save();renderAll();toast("Imported");}
catch(err){toast("This is not valid backup text");}
return;
}
else return;
save();renderPlan();toast("Saved");
});
$("plan").addEventListener("change",e=>{
const t=e.target;
if(t.dataset.gsave){const g=state.goals.find(x=>String(x.id)===t.dataset.gsave);if(g)g.saved=num(t.value);}
else if(t.id==="cSal"){const v=num(t.value);if(v!==state.career.salary){state.career.hist=state.career.hist||[];state.career.hist.push({date:today(),salary:v});}state.career.salary=v;}
else if(t.id==="cTgt"){state.career.target=num(t.value);}
else if(t.id==="cDate"){state.career.date=t.value;}
else if(t.id==="hCk"){state.checkup=t.value;}
else return;
save();renderPlan();toast("Saved");
});

/* Reminder */
function notifStat(){
const el=$("notifStat");if(!el)return;
let s="Notification: not supported in this browser";
try{s="Notification: "+Notification.permission}catch(e){}
el.textContent=s;
}
function renderRem(){
const rows=state.rem.slice().sort((a,b)=>a.time.localeCompare(b.time)).map(r=>`
<div class="rem">
<input type="time" data-rt="${r.id}" value="${r.time}">
<input type="text" data-rl="${r.id}" value="${esc(r.label)}">
<input type="checkbox" data-ro="${r.id}" ${r.on?"checked":""} title="On / Off">
<button class="btn sm ghost" data-rd="${r.id}">Remove</button>
</div>`).join("");
$("rem").innerHTML=`<div class="card">
<h2>Reminders</h2>
<div class="muted" style="margin-bottom:10px">Reminders only work while this page is open. For alarms when the phone is locked, use the phone's Clock app.</div>
<div class="row"><button class="btn pri" id="notif">Enable notifications</button><button class="btn" id="addRem">+ New reminder</button></div>
<div class="muted" id="notifStat" style="margin-bottom:6px"></div>
${rows}
</div>`;
notifStat();
}
$("rem").addEventListener("change",e=>{
const t=e.target,id=t.dataset.rt||t.dataset.rl||t.dataset.ro;if(!id)return;
const r=state.rem.find(x=>String(x.id)===id);if(!r)return;
if(t.dataset.rt)r.time=t.value;
if(t.dataset.rl)r.label=t.value;
if(t.dataset.ro)r.on=t.checked;
save();renderRem();toast("Saved");
});
$("rem").addEventListener("click",async e=>{
const t=e.target.closest("button");if(!t)return;
if(t.dataset.rd){state.rem=state.rem.filter(x=>String(x.id)!==t.dataset.rd);save();renderRem();}
else if(t.id==="addRem"){state.rem.push({id:Date.now(),time:"12:00",label:"New reminder",on:true});save();renderRem();}
else if(t.id==="notif"){
try{const p=await Notification.requestPermission();toast(p==="granted"?"Notifications enabled":"Notifications not allowed");}
catch(err){toast("Notifications are not supported in this browser");}
notifStat();
}
});
function showBanner(text){
const b=$("banner");
b.innerHTML=`<div style="font-weight:bold;margin-bottom:6px">Reminder</div><div>${esc(text)}</div><button class="btn sm" id="okBtn" style="margin-top:10px">OK</button>`;
b.classList.add("show");
}
$("banner").addEventListener("click",e=>{if(e.target.id==="okBtn")$("banner").classList.remove("show");});
function beep(){
try{const A=window.AudioContext||window.webkitAudioContext;const c=new A();const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=0.2;o.start();o.stop(c.currentTime+0.6);}catch(e){}
}
function tick(){
const n=new Date(),hm=pad(n.getHours())+":"+pad(n.getMinutes()),dk=fmtKey(n);
state.rem.forEach(r=>{
if(!r.on||r.time!==hm||state.fired[r.id]===dk)return;
state.fired[r.id]=dk;save();
showBanner(`${r.time} - ${r.label}`);
beep();
try{if("Notification" in window&&Notification.permission==="granted")new Notification("Life Tracker",{body:r.label});}catch(e){}
try{navigator.vibrate&&navigator.vibrate([300,150,300]);}catch(e){}
});
}
setInterval(tick,15000);

/* Tabs */
const render={aaj:renderToday,exp:renderExp,inv:renderInv,plan:renderPlan,week:renderWeek,rem:renderRem};
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));
document.querySelectorAll("main section").forEach(s=>s.hidden=s.id!==b.dataset.tab);
render[b.dataset.tab]();
});

renderToday();renderExp();renderInv();renderWeek();renderPlan();renderRem();tick();
</script>
</body>
</html>
