<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Life Tracker</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#1b1f2a;--muted:#6b7280;--accent:#2563eb;--ok:#16a34a;--warn:#dc2626;--line:#e5e7eb;--soft:#eef2ff;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121418;--card:#1c2028;--text:#e8eaef;--muted:#9aa3b2;--accent:#6ea8ff;--ok:#4ade80;--warn:#f87171;--line:#2b303b;--soft:#232a38;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121418;--card:#1c2028;--text:#e8eaef;--muted:#9aa3b2;--accent:#6ea8ff;--ok:#4ade80;--warn:#f87171;--line:#2b303b;--soft:#232a38;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);font-size:16px;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
header{padding:14px 16px 6px;font-size:22px;font-weight:bold;max-width:560px;margin:0 auto}
nav{display:flex;gap:6px;padding:6px 12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;max-width:584px;margin:0 auto}
nav button{flex:1;padding:12px 2px;border:0;border-radius:12px;background:var(--card);color:var(--muted);font-size:13px;font-weight:bold;cursor:pointer}
nav button.on{background:var(--accent);color:#fff}
main{padding:8px 14px 48px;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
h2{font-size:17px;margin:0 0 10px}
.muted{color:var(--muted);font-size:13px}
.ctr{text-align:center}
.lbl{font-size:19px;font-weight:bold}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);font-size:16px;font-family:inherit}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dayNav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.dayNav .ctr{flex:1}
.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--soft);color:var(--text);font-size:15px;font-weight:bold;cursor:pointer}
.btn.pri{background:var(--accent);color:#fff}
.btn.sm{padding:9px 12px;font-size:13px}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.row input{flex:1}
.progress{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px}
.progress>div{height:100%;width:0;background:var(--ok);transition:width .3s}
.pills{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.pill{border:2px solid var(--line);background:var(--card);color:var(--text);border-radius:14px;padding:14px 10px;font-size:15px;font-weight:bold;text-align:left;cursor:pointer}
.pill.on{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.pill small{display:block;color:var(--muted);font-weight:normal;font-size:12px;margin-top:4px}
.step{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.stepper{display:flex;align-items:center;gap:12px}
.stepper .btn{width:50px;height:50px;padding:0;font-size:22px;border-radius:50%}
.val{font-size:26px;font-weight:bold;min-width:50px;text-align:center}
.bigNum{font-size:26px;font-weight:bold}
.ok{color:var(--ok)}
.bad{color:var(--warn)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--soft);border-radius:12px;padding:12px}
.stat b{display:block;font-size:17px;margin:3px 0}
.rem{display:grid;grid-template-columns:112px 1fr auto auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.rem input[type=time]{padding:8px}
.rem input[type=text]{padding:8px;font-size:14px}
.rem input[type=checkbox]{width:22px;height:22px}
.news{border-bottom:1px solid var(--line);padding:10px 0}
.news a{color:var(--accent);font-size:13px}
.rem2{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.hint{font-size:13px;color:var(--muted);margin:0 0 10px}
.subtabs{display:flex;gap:6px;margin-bottom:12px}
.subtabs button{flex:1;padding:11px 4px;border:0;border-radius:12px;background:var(--card);color:var(--muted);font-weight:bold;font-size:14px;cursor:pointer}
.subtabs button.on{background:var(--accent);color:#fff}
.hold{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.hTop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.banner{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));background:var(--accent);color:#fff;border-radius:16px;padding:14px;z-index:20;display:none;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:536px;margin:0 auto}
.banner.show{display:block}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
@media (max-width:360px){.pills,.grid2,.stats{grid-template-columns:1fr}.rem{grid-template-columns:100px 1fr}}
</style>
</head>
<body>
<header>Life Tracker</header>
<nav>
<button class="on" data-tab="aaj">Today</button>
<button data-tab="exp">Spending</button>
<button data-tab="inv">Invest</button>
<button data-tab="plan">Plan</button><button data-tab="week">Week</button>
<button data-tab="rem">Reminder</button>
</nav>
<main>
<section id="aaj">
<div class="dayNav"><button class="btn" id="prev">‹</button><div class="ctr"><div class="lbl" id="dayLbl"></div><div class="muted" id="dayType"></div></div><button class="btn" id="next">›</button></div>
<div class="ctr" style="margin-bottom:12px"><button class="btn sm ghost" id="goToday">Go to today</button> <input type="date" id="jump" style="width:auto;display:inline-block;padding:8px"></div>
<div class="card"><div class="muted" id="progTxt"></div><div class="progress"><div id="prog"></div></div></div>
<div class="card" id="todayBox"></div>
</section>
<section id="exp" hidden></section>
<section id="inv" hidden></section>
<section id="plan" hidden></section><section id="week" hidden></section>
<section id="rem" hidden></section>
</main>
<div class="banner" id="banner"></div>
<div class="toast" id="toast"></div>
<script>
const KEY="life-tracker-v1";
const WD=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],MO=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const $=id=>document.getElementById(id), pad=n=>String(n).padStart(2,"0"), num=v=>Number(v)||0;
const fmtKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>fmtKey(new Date());
const lab=d=>`${WD[d.getDay()]} ${d.getDate()} ${MO[d.getMonth()]}`;
const isOff=d=>d.getDay()===4||d.getDay()===5;
const esc=s=>String(s).replace(/[&"<]/g,c=>({"&":"&amp;","\"":"&quot;","<":"&lt;"}[c]));
const fmt=n=>Number(n).toLocaleString("en-IN",{maximumFractionDigits:2});
const sgn=n=>n>=0?"+":"";
const cls=n=>n>=0?"ok":"bad";
const pcOf=(a,b)=>b?a/b*100:0;
const NDAYS=Math.round((new Date(2030,11,31)-new Date(2026,9,17))/864e5)+1;
const DAYS=Array.from({length:NDAYS},(_,i)=>new Date(2026,9,17+i));
const MS=Array.from({length:60},(_,i)=>{const d=new Date(2026,9+i,1);return{key:`${d.getFullYear()}-${pad(d.getMonth()+1)}`,label:`${MO[d.getMonth()]} ${d.getFullYear()}`};});
const DEF_REM=[
{id:1,time:"01:00",label:"Eat your tiffin on break, use phone less",on:true},
{id:2,time:"01:30",label:"Last chai or coffee. After this, only water",on:true},
{id:3,time:"03:30",label:"Eat fruit, chana or nuts",on:true},
{id:4,time:"08:15",label:"Keep phone away, make the room dark",on:true},
{id:5,time:"15:30",label:"Wake up: drink water, 5 min stretching (also set on phone)",on:false},
{id:6,time:"18:30",label:"Pack tiffin (also set on phone)",on:false},
{id:7,time:"19:00",label:"Leave home (also set on phone)",on:false}
];
const NEWS=[
{d:"13 Oct 2026",t:"Nifty 50 closed at 22,721.95 (+1.60%) and Sensex at 73,033.78 (+1.54%). IT stocks rallied after HCLTech's Q2 results.",s:"Ventura Securities",u:"https://www.venturasecurities.com/?p=65192"},
{d:"12 Oct 2026",t:"Markets fell. Sensex closed at 71,924.68 (-0.76%) and Nifty at 22,363.35 (-0.70%).",s:"Kotak Neo",u:"https://www.kotakneo.com/news/market-news/stock-market-update-13-october-2026-sensex-nifty/"},
{d:"8 Oct 2026",t:"In early trade Sensex fell about 368 points and Nifty slipped below 22,500. The rupee opened near 96.7 per dollar.",s:"Kotak Neo",u:"https://www.kotakneo.com/news/market-news/stock-market-update-8-october-2026-sensex-nifty/"},
{d:"Risks to watch",t:"Inflation, crude oil prices, rupee movement and how narrow the rally is across sectors remain the main risks.",s:"Ventura Securities",u:"https://www.venturasecurities.com/?p=65192"}
];

let state;
try{state=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){state=null}
if(!state)state={days:{},exp:{"2026-10":{salary:30000,doodh:4000,travel:6000,ghar:0,other:0}},target:30000};
state.days=state.days||{};state.exp=state.exp||{};state.target=state.target||30000;state.rem=state.rem||DEF_REM;state.fired=state.fired||{};
normalize();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
