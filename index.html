<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Life Tracker</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#1b1f2a;--muted:#6b7280;--accent:#2563eb;--ok:#16a34a;--warn:#dc2626;--line:#e5e7eb;--soft:#eef2ff;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121418;--card:#1c2028;--text:#e8eaef;--muted:#9aa3b2;--accent:#6ea8ff;--ok:#4ade80;--warn:#f87171;--line:#2b303b;--soft:#232a38;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121418;--card:#1c2028;--text:#e8eaef;--muted:#9aa3b2;--accent:#6ea8ff;--ok:#4ade80;--warn:#f87171;--line:#2b303b;--soft:#232a38;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);font-size:16px;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
header{padding:14px 16px 6px;font-size:22px;font-weight:bold;max-width:560px;margin:0 auto}
nav{display:flex;gap:6px;padding:6px 12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;max-width:584px;margin:0 auto}
nav button{flex:1;padding:12px 2px;border:0;border-radius:12px;background:var(--card);color:var(--muted);font-size:13px;font-weight:bold;cursor:pointer}
nav button.on{background:var(--accent);color:#fff}
main{padding:8px 14px 48px;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
h2{font-size:17px;margin:0 0 10px}
.muted{color:var(--muted);font-size:13px}
.ctr{text-align:center}
.lbl{font-size:19px;font-weight:bold}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);font-size:16px;font-family:inherit}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dayNav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.dayNav .ctr{flex:1}
.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--soft);color:var(--text);font-size:15px;font-weight:bold;cursor:pointer}
.btn.pri{background:var(--accent);color:#fff}
.btn.sm{padding:9px 12px;font-size:13px}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.row input{flex:1}
.progress{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px}
.progress>div{height:100%;width:0;background:var(--ok);transition:width .3s}
.pills{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.pill{border:2px solid var(--line);background:var(--card);color:var(--text);border-radius:14px;padding:14px 10px;font-size:15px;font-weight:bold;text-align:left;cursor:pointer}
.pill.on{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.pill small{display:block;color:var(--muted);font-weight:normal;font-size:12px;margin-top:4px}
